services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fuel_routes}
      POSTGRES_USER: ${POSTGRES_USER:-fuel_routes}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fuel_routes_dev_password}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  web:
    build: .
    ports:
      - "${WEB_PORT:-8000}:8000"
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-local-docker-only-change-me}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-false}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,0.0.0.0}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-}
      DJANGO_SECURE_COOKIES: ${DJANGO_SECURE_COOKIES:-false}
      POSTGRES_DB: ${POSTGRES_DB:-fuel_routes}
      POSTGRES_USER: ${POSTGRES_USER:-fuel_routes}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fuel_routes_dev_password}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
      OSRM_BASE_URL: ${OSRM_BASE_URL:-https://router.project-osrm.org}
      NOMINATIM_BASE_URL: ${NOMINATIM_BASE_URL:-https://nominatim.openstreetmap.org}
      NOMINATIM_USER_AGENT: ${NOMINATIM_USER_AGENT:-fuel-route-optimizer/1.0 (backend assessment)}
      NOMINATIM_EMAIL: ${NOMINATIM_EMAIL:-}
      EXTERNAL_API_TIMEOUT_SECONDS: ${EXTERNAL_API_TIMEOUT_SECONDS:-10}
      FUEL_STATION_ROUTE_CORRIDOR_MILES: ${FUEL_STATION_ROUTE_CORRIDOR_MILES:-10}
      FUEL_STOP_PENALTY_DOLLARS: ${FUEL_STOP_PENALTY_DOLLARS:-5}
      ROUTE_CACHE_TTL_SECONDS: ${ROUTE_CACHE_TTL_SECONDS:-86400}
      API_ANON_THROTTLE_RATE: ${API_ANON_THROTTLE_RATE:-60/minute}
      LOAD_FUEL_DATA_ON_START: ${LOAD_FUEL_DATA_ON_START:-true}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
